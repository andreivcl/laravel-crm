name: Daily short (3D studio)

# Renders today's 3D short every morning, refreshes analytics, and (optionally)
# publishes. Outputs are uploaded as an artifact; plans, ideas and analytics
# data are committed back so the learning loop keeps its memory.

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the platforms after rendering"
        type: boolean
        default: false
      platforms:
        description: "Comma-separated: youtube,instagram,tiktok"
        default: "youtube,instagram,tiktok"

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio
    env:
      REMOTION_GL: swangle # GitHub runners have no GPU
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Daily pipeline
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.publish }}" = "true" ]; then
            node scripts/daily.ts --publish --platforms="${{ inputs.platforms }}"
          else
            node scripts/daily.ts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: |
            studio/out/*/video.mp4
            studio/out/*/cover.png
            studio/out/*/captions.md
            studio/out/dashboard.html
          retention-days: 30
      - name: Commit plans, ideas and analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data
          git diff --cached --quiet || git commit -m "studio: daily plan + analytics $(date -u +%F)"
          git push
